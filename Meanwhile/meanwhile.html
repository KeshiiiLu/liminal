<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meanwhile</title>

  <link rel="stylesheet" href="./meanwhile.css" />
  <link rel="stylesheet" href="../interaction.css">
  <script src="../interaction.js" defer></script>
</head>

<body>
  <main class="meanwhile-app">

    <!-- =========================
         竖屏入口
    ========================== -->
    <section class="portrait-gate">
      <div class="gate-content">
        <div class="gate-day">Day 1</div>

        <h1>今天也要开店吗？</h1>

        <div class="rotate-icon">↻</div>

        <p>请将手机横过来</p>
      </div>
    </section>


    <!-- =========================
         横屏游戏主体
    ========================== -->
    <section class="game-screen">

      <!-- 顶部状态栏 -->
      <header class="top-bar">
        <div class="top-item">
          <span class="top-label">DAY</span>
          <strong>1</strong>
        </div>

        <div class="top-item">
          <span class="top-label">FOCUS</span>
          <strong id="focusTime">00:00:00</strong>
        </div>

        <div class="top-item">
          <span class="top-label">TOTAL</span>
          <strong id="totalTime">00:00:00</strong>
        </div>

        <div class="top-item money">
          <span class="top-label">CASH</span>
          <strong id="cashValue">₤ 100</strong>
        </div>
      </header>


      <!-- =========================
     店铺
========================== -->
<section class="shop">

  <!-- 背景窗景：只做氛围 -->
  <div class="shop-window-bg" aria-hidden="true"></div>

  <!-- 左上：楼梯 / 我们的部分 -->
  <div class="fixture stairs">
    <span class="fixture-icon">↟</span>
    <span>二楼楼梯</span>
  </div>

  <div class="fixture coffee-station">
    <span class="fixture-icon">☕</span>
    <span>咖啡机</span>
  </div>

  <!-- 中上：明档厨房 -->
  <div class="fixture kitchen-sink">
    <span class="fixture-icon">◫</span>
    <span>水池</span>
  </div>

  <div class="fixture stove-two">
    <span class="fixture-icon">♨</span>
    <span>灶台2</span>
  </div>

  <div class="fixture prep-table prep-table-top">
    <span>置物台</span>
  </div>

  <div class="storage-room">
    <span>仓房</span>
  </div>


  <!-- Keshi 固定专注位 -->
  <div class="keshi-zone">

    <div class="study-desk">
      <div class="book">📖</div>
    </div>

    <div
      id="keshiCharacter"
      class="character keshi"
      aria-label="Keshi"
    >
      <div class="head">
        <div class="glasses"></div>
      </div>

      <div class="body"></div>
    </div>

    <div
      id="keshiStatus"
      class="character-label keshi-label"
    >
      Keshi · 等你开始
    </div>

  </div>


  <!-- 主前台：更宽 -->
  <div class="front-counter">
    <div class="counter-top"></div>

    <span class="counter-label">
      收银台 & 灶台1
    </span>

    <span class="counter-stove">♨</span>
  </div>

  <!-- 炸薯条机 -->
  <div class="fixture fryer">
    <span class="fixture-icon">🍟</span>
    <span>炸薯条机</span>
  </div>

  <!-- 面向餐桌的出餐台 -->
  <div class="fixture prep-table prep-table-front">
    <span>出餐台</span>
  </div>

  <!-- 靠门口的置物台：以后也能做外卖取餐 -->
  <div class="entry-shelf">
    <span>置物台</span>
    <small>杂物 / 未来外卖取餐</small>
  </div>


  <!-- 顾客区 -->
  <div class="dining-area">

    <div class="table table-one">
      <span>餐桌</span>
    </div>

    <div class="table table-two">
      <span>餐桌</span>
    </div>

    <div class="table table-three">
      <span>餐桌</span>
    </div>

    <div class="table table-four">
      <span>餐桌</span>
    </div>

    <div class="table table-five">
      <span>餐桌</span>
    </div>

    <div class="table table-six">
      <span>餐桌</span>
    </div>

  </div>


  <!-- 右下：洗手区 / 洗手间 -->
  <div class="restroom-area">
    <span class="washbasin">洗手台</span>
    <span class="restroom">洗手间</span>
  </div>


  <!-- 门口 -->
  <div class="entrance">
    <span>门口</span>
  </div>


  <!-- 陆榛 -->
  <div
    id="luzhenCharacter"
    class="character luzhen"
    aria-label="陆榛"
  >
    <div class="head"></div>
    <div class="body"></div>

    <div
      id="luzhenStatus"
      class="character-label"
    >
      陆榛 · 等待营业
    </div>
  </div>


  <!-- 店员 -->
  <div
    id="staffCharacter"
    class="character staff"
    aria-label="店员"
  >
    <div class="head"></div>
    <div class="body"></div>

    <div class="character-label">
      店员
    </div>
  </div>


  <!-- 顾客 -->
  <div
    id="customer"
    class="character customer customer-at-entry"
    aria-label="顾客"
  >
    <div class="head"></div>
    <div class="body"></div>

    <div
      id="customerStatus"
      class="character-label"
    >
      等待营业
    </div>
  </div>

</section>


    <!-- =========================
         本轮结算
    ========================== -->
    <section
      id="resultPanel"
      class="result-panel hidden"
    >
      <div class="result-card">

        <div class="result-small">
          Day 1
        </div>

        <h2>今天先到这里。</h2>

        <div class="result-list">

          <div>
            <span>本轮专注</span>
            <strong id="resultFocus">
              00:00:00
            </strong>
          </div>

          <div>
            <span>接待顾客</span>
            <strong id="resultCustomers">
              0
            </strong>
          </div>

          <div>
            <span>营业额</span>
            <strong id="resultRevenue">
              ₤ 0
            </strong>
          </div>

        </div>

        <button
          id="closeResultButton"
          type="button"
        >
          回到店里
        </button>

      </div>
    </section>

  </main>

  <script src="./meanwhile.js"></script>
</body>
</html>
