<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#f4f3f0">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Liminal">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>电子字卡 · Liminal</title>

    <link rel="stylesheet" href="cards.css">
  <script src="storage-migrations.js"></script>
  <link rel="stylesheet" href="interaction.css">
  <script src="interaction.js" defer></script>
</head>

<body>

    <main class="cards-shell">


        <!-- =========================
             顶部
             ========================= -->

        <header class="cards-header">

            <a class="cards-back" href="library.html" aria-label="返回语料库">
                ‹
            </a>


            <div class="cards-title">

                <span>
                    ELECTRONIC CARDS
                </span>

                <h1>
                    电子字卡
                </h1>

            </div>


            <div class="cards-mode" aria-label="只读浏览">
                阅
            </div>

        </header>


        <!-- =========================
             总览
             ========================= -->

        <section class="cards-summary">

            <div class="summary-main">

                <span>
                    SHARED TREE
                </span>

                <strong id="summaryTitle">
                    日常
                </strong>

                <div class="summary-text-stats">

                    <p id="summaryText">
                        38个层级
                    </p>

                    <p id="summaryCardText">
                        —枚字卡
                    </p>

                </div>

            </div>


            <div class="summary-stats">


                <!-- 01 层级数量 -->

                <div class="summary-mark">

                    <span id="summaryNumber">
                        38
                    </span>

                    <small>
                        01
                    </small>

                </div>


                <!-- 实际可运行字卡数量 -->

                <div class="summary-mark summary-card-mark">

                    <span id="sectionCardCount">
                        —
                    </span>

                    <small>
                        字卡
                    </small>

                </div>


            </div>

        </section>


        <!-- =========================
             分区切换
             ========================= -->

        <nav class="section-tabs" aria-label="字卡分区">

            <button class="section-tab active" type="button" data-section="normal">
                日常
            </button>


            <button class="section-tab" type="button" data-section="intimate">
                亲密
            </button>


            <button class="section-tab" type="button" data-section="adult">
                情欲
            </button>

        </nav>


        <!-- =========================
             搜索
             ========================= -->

        <div class="cards-search">

            <span class="search-icon">
                ⌕
            </span>


            <input id="cardsSearch" type="search" autocomplete="off" placeholder="搜索 01 层级">


            <button id="searchClear" type="button" hidden aria-label="清除搜索">
                ×
            </button>

        </div>


        <!-- =========================
             当前列表标题
             ========================= -->

        <div class="cards-list-heading">

            <div>

                <span>
                    RANDOM ENTRY
                </span>

                <strong>
                    01 层级
                </strong>

            </div>


            <small id="resultCount">
                38 项
            </small>

        </div>


        <!-- =========================
             01 列表
             ========================= -->

        <section class="cards-list" id="cardsList"></section>


        <!-- =========================
             空状态
             ========================= -->

        <section class="cards-empty" id="cardsEmpty" hidden>

            <span>
                NO RESULT
            </span>

            <p>
                没找到对应的 01 层级
            </p>

        </section>


    </main>


    <!-- =========================
         01 详情 Sheet
         ========================= -->

    <div class="detail-backdrop" id="detailBackdrop" hidden></div>


    <section class="detail-sheet" id="detailSheet" aria-hidden="true">

        <div class="detail-handle"></div>


        <div class="detail-header">

            <div>

                <span id="detailPath">
                    日常 / 01
                </span>

                <h2 id="detailTitle">
                    连接与通道状态
                </h2>

            </div>


            <button class="detail-close" id="detailClose" type="button" aria-label="关闭">
                ×
            </button>

        </div>


        <div class="detail-meta">

            <span id="detailType">
                分类树
            </span>

            <i></i>

            <span>
                逐层随机
            </span>

        </div>


        <div class="tree-preview" id="treePreview"></div>


        <div class="detail-readonly">

            <span>
                READ ONLY
            </span>

            <p>
                固定语料与分类结构由电脑端维护
            </p>

        </div>

    </section>


    <!-- =========================
         搜索转换
         ========================= -->

    <script src="opencc-full.js"></script>


    <!-- =========================
     页面逻辑
     ========================= -->

<script src="cards-corpus-data.js"></script>

<script src="cards.js"></script>

</body>

</html>
