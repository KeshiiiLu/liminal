<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Liminal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f3f0">

  <title>版本与更新 · Liminal</title>

  <link rel="stylesheet" href="changelog.css">
</head>

<body>

  <main class="changelog-shell">

    <header class="changelog-header">

      <a
        class="changelog-back"
        href="settings.html"
        aria-label="返回设置"
      >
        ‹
      </a>

      <div>
        <span>VERSION HISTORY</span>
        <h1>版本与更新</h1>
      </div>

    </header>


    <section
      class="current-version-card"
      aria-labelledby="currentVersionNumber"
    >

      <span class="current-version-eyebrow">
        CURRENT RELEASE
      </span>

      <div class="current-version-main">

        <div>
          <strong id="currentVersionNumber"></strong>
          <p id="currentVersionLabel"></p>
        </div>

        <time id="currentVersionDate"></time>

      </div>

    </section>


    <section
      class="history-section"
      aria-labelledby="historyTitle"
    >

      <div class="history-heading">
        <span>CHANGELOG</span>
        <h2 id="historyTitle">版本时间线</h2>
      </div>

      <div
        class="version-timeline"
        id="versionTimeline"
        aria-live="polite"
      ></div>

    </section>

  </main>

  <script src="version-data.js"></script>
  <script src="version-ui.js"></script>

</body>

</html>
