<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f4f3f0"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Liminal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>搜索聊天 · Liminal</title>

  <link
    rel="stylesheet"
    href="chat-search.css"
  >
  <link rel="stylesheet" href="avatar-store.css">
  <script src="storage-migrations.js"></script>
  <link rel="stylesheet" href="interaction.css">
  <script src="interaction.js" defer></script>
</head>


<body>

  <main class="search-page">

    <header class="search-header">

      <button
        class="search-back"
        id="searchBack"
        type="button"
        data-liminal-nav
      >
        ‹
      </button>


      <div class="search-heading">

        <span>
          CHAT SEARCH
        </span>

        <h1 id="searchPersonName">
          搜索聊天
        </h1>

      </div>


      <div></div>

    </header>


    <section class="search-box">

      <span class="search-symbol">
        ⌕
      </span>

      <input
        id="chatSearchInput"
        type="search"
        placeholder="搜索当前聊天"
        autocomplete="off"
      >

      <button
        id="clearSearchButton"
        type="button"
        hidden
      >
        ×
      </button>

    </section>


    <nav class="search-filters">

      <button
        class="search-filter active"
        type="button"
        data-filter="all"
      >
        全部
      </button>

      <button
        class="search-filter"
        type="button"
        data-filter="text"
      >
        文字
      </button>

      <button
        class="search-filter"
        type="button"
        data-filter="gift"
      >
        礼物
      </button>

    </nav>


    <div class="search-summary">

      <span id="searchSummary">
        0 条消息
      </span>

    </div>


    <section
      class="search-results"
      id="searchResults"
    >
    </section>


    <section
      class="search-empty"
      id="searchEmpty"
      hidden
    >

      <div>
        ⌕
      </div>

      <strong>
        没有找到消息
      </strong>

      <span>
        换个关键词或消息类型试试
      </span>

    </section>

  </main>


  <script src="avatar-store.js"></script>
  <script src="chat-search.js"></script>

  <script src="call-global.js"></script>

</body>

</html>
