<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#f4f3f0">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Liminal">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>聊天设置 · Liminal</title>

    <link rel="stylesheet" href="chat-settings.css">
    <link rel="stylesheet" href="avatar-store.css">
  <script src="storage-migrations.js"></script>
  <link rel="stylesheet" href="interaction.css">
  <script src="interaction.js" defer></script>
</head>


<body>

    <main class="chat-settings-page">


        <!-- 顶部 -->

        <header class="settings-header">

            <button class="settings-back" id="settingsBack" type="button" data-liminal-nav>
                ‹
            </button>


            <div class="settings-heading">

                <span>
                    CURRENT CHAT
                </span>

                <h1 id="settingsPersonName">
                    聊天设置
                </h1>

            </div>


            <div class="settings-header-space">
            </div>

        </header>


        <!-- 人物 -->

        <section class="person-card">

            <div class="person-avatar" id="settingsPersonAvatar">
                L
            </div>


            <div class="person-info">

                <strong id="settingsPersonTitle">
                    榛榛
                </strong>

                <span>
                    当前聊天
                </span>

            </div>

        </section>

        <!-- AVATAR -->

        <section class="settings-group avatar-settings-group">

            <div class="group-label">
                PROFILE
            </div>

            <button class="settings-item avatar-settings-item" id="partnerAvatarSetting" type="button">
                <span class="settings-person-avatar" id="partnerAvatarPreview">L</span>
                <span class="settings-text">
                    <strong id="partnerAvatarLabel">更换榛榛头像</strong>
                    <span>当前聊天对象</span>
                </span>
                <span class="settings-arrow">›</span>
            </button>

            <button class="settings-item avatar-settings-item" id="userAvatarSetting" type="button">
                <span class="settings-person-avatar" id="userAvatarPreview" data-avatar-person="keshi" data-avatar-fallback="K">K</span>
                <span class="settings-text">
                    <strong>更换 Keshi 头像</strong>
                    <span>我的头像</span>
                </span>
                <span class="settings-arrow">›</span>
            </button>

        </section>


        <!-- CHAT -->

        <section class="settings-group">

            <div class="group-label">
                CHAT
            </div>


            <button class="settings-item" type="button"
                onclick="window.location.href='chat-search.html' + window.location.search">

                <span class="settings-icon">
                    ⌕
                </span>

                <span class="settings-text">

                    <strong>
                        搜索聊天
                    </strong>

                    <span>
                        查找当前聊天中的消息
                    </span>

                </span>

                <span class="settings-arrow">
                    ›
                </span>

            </button>


            <button class="settings-item" type="button"
                onclick="window.location.href='chat-frequency.html' + window.location.search">

                <span class="settings-icon">
                    %
                </span>

                <span class="settings-text">

                    <strong>
                        互动频率
                    </strong>

                    <span>
                        消息、通话、拍一拍、礼物等
                    </span>

                </span>

                <span class="settings-arrow">
                    ›
                </span>

            </button>


            <button class="settings-item" type="button">

                <span class="settings-icon">
                    ◌
                </span>

                <span class="settings-text">

                    <strong>
                        回复与在线状态
                    </strong>

                    <span>
                        回复延迟、忙碌状态等
                    </span>

                </span>

                <span class="settings-arrow">
                    ›
                </span>

            </button>


            <button class="settings-item" type="button">

                <span class="settings-icon">
                    ☆
                </span>

                <span class="settings-text">

                    <strong>
                        置顶聊天
                    </strong>

                    <span>
                        调整消息列表中的位置
                    </span>

                </span>

                <span class="settings-arrow">
                    ›
                </span>

            </button>

        </section>


        <!-- DATA -->

        <section class="settings-group">

            <div class="group-label">
                DATA
            </div>


            <button class="settings-item" type="button">

                <span class="settings-icon">
                    ↥
                </span>

                <span class="settings-text">

                    <strong>
                        导出当前聊天
                    </strong>

                    <span>
                        保存这段聊天的数据
                    </span>

                </span>

                <span class="settings-arrow">
                    ›
                </span>

            </button>


            <button class="settings-item danger" type="button">

                <span class="settings-icon">
                    ×
                </span>

                <span class="settings-text">

                    <strong>
                        清空聊天记录
                    </strong>

                    <span>
                        删除当前人物的全部聊天消息
                    </span>

                </span>

                <span class="settings-arrow">
                    ›
                </span>

            </button>

        </section>


    </main>

    <div class="avatar-editor" id="avatarEditor" aria-hidden="true" inert hidden>
        <button class="avatar-editor-backdrop" id="avatarEditorBackdrop" type="button" aria-label="取消更换头像"></button>
        <section class="avatar-editor-sheet" role="dialog" aria-modal="true" aria-labelledby="avatarEditorTitle">
            <div class="avatar-editor-handle" aria-hidden="true"></div>
            <header class="avatar-editor-header">
                <div>
                    <span>PROFILE IMAGE</span>
                    <h2 id="avatarEditorTitle">更换头像</h2>
                </div>
                <button class="avatar-editor-close" id="avatarEditorClose" type="button" aria-label="取消">×</button>
            </header>

            <div class="avatar-editor-preview" id="avatarEditorPreview">L</div>
            <p class="avatar-editor-help">图片会从中心裁成正方形，并压缩后仅保存在这台设备。</p>

            <label class="avatar-file-button" for="avatarFileInput">
                <span>从相册选择图片</span>
                <input id="avatarFileInput" type="file" accept="image/*">
            </label>

            <p class="avatar-editor-status" id="avatarEditorStatus" aria-live="polite"></p>

            <div class="avatar-editor-actions">
                <button class="avatar-editor-secondary" id="avatarEditorCancel" type="button">取消</button>
                <button class="avatar-editor-primary" id="avatarEditorSave" type="button" data-liminal-allow-repeat disabled>保存</button>
            </div>

            <button class="avatar-reset-button" id="avatarResetButton" type="button">恢复默认头像</button>
        </section>
    </div>

    <script src="avatar-store.js"></script>
    <script src="chat-settings-page.js"></script>

    <script src="call-global.js"></script>
    
</body>

</html>
