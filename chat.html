<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 · Liminal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page">

  <header class="chat-header">

    <button class="chat-back" onclick="window.location.href='messages.html'">
      ‹
    </button>

    <div class="chat-person">
      <strong id="chatPersonName">榛榛</strong>
      <span id="chatPersonStatus">在线</span>
    </div>

    <button
  class="chat-settings"
  type="button"
  onclick="window.location.href='chat-settings.html' + window.location.search"
>
  ···
</button>

  </header>


  <main class="chat-messages" id="chatMessages">
  </main>


  <footer class="chat-bottom">

    <div class="chat-input-bar">

      <button class="chat-tool voice-button" aria-label="语音">
        <svg class="voice-icon" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2" />

          <path d="M12 13.5
         C13.8 15
         13.8 17
         12 18.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

          <path d="M16 10.5
         C20 13.5
         20 18.5
         16 21.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

          <path d="M9 15
         L7.5 16
         L9 17" fill="currentColor" />
        </svg>
      </button>

      <input class="chat-input" type="text" placeholder="输入消息">

      <button class="chat-tool" aria-label="表情">
        ☺
      </button>

      <button class="chat-tool" id="moreButton" aria-label="更多">
        ＋
      </button>

    </div>


    <div class="more-panel" id="morePanel">

      <div class="more-pages" id="morePages">

        <section class="more-page">

          <button class="more-item">
            <span class="more-icon">▧</span>
            <small>相片</small>
          </button>

          <button class="more-item">
            <span class="more-icon">卡</span>
            <small>语料池</small>
          </button>

          <button
  class="more-item"
  id="continueSayButton"
  type="button"
>
  <span class="more-icon">↻</span>
  <small>继续说</small>
</button>

          <button
  class="more-item"
  id="videoCallButton"
  type="button"
>
  <span class="more-icon">▣</span>
  <small>视频通话</small>
</button>

          <button class="more-item">
            <span class="more-icon">⌖</span>
            <small>位置</small>
          </button>

          <button class="more-item">
            <span class="more-icon">封</span>
            <small>红包</small>
          </button>

          <button class="more-item">
            <span class="more-icon">礼</span>
            <small>礼物</small>
          </button>

          <button class="more-item">
            <span class="more-icon">☆</span>
            <small>收藏</small>
          </button>

        </section>


        <section class="more-page">

  <button
    class="more-item"
    id="pokeButton"
    type="button"
  >
    <span class="more-icon">☞</span>
    <small>拍一拍</small>
  </button>


  <button class="more-item">
    <span class="more-icon">￥</span>
    <small>转账</small>
  </button>

</section>

      </div>


      <div class="page-dots">
        <span class="page-dot active"></span>
        <span class="page-dot"></span>
      </div>

    </div>

  </footer>

    <!-- 拍一拍 / 动作浮窗面板 -->

  <div
    class="poke-action-panel"
    id="pokeActionPanel"
    hidden
  >

    <div class="poke-action-sheet">

      <div class="poke-action-header">

        <strong>
          拍一拍
        </strong>

        <button
          class="poke-action-close"
          id="pokeActionClose"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>

      </div>


      <div class="poke-action-quick">

        <button
  class="poke-quick-item"
  type="button"
  data-action="摸了摸{target}的头"
>
  摸摸头
</button>

<button
  class="poke-quick-item"
  type="button"
  data-action="戳了戳{target}的脸"
>
  戳戳脸
</button>

<button
  class="poke-quick-item"
  type="button"
  data-action="抱了抱{target}"
>
  抱一下
</button>

<button
  class="poke-quick-item"
  type="button"
  data-action="亲了亲{target}"
>
  亲一下
</button>

      </div>


      <div class="poke-action-custom">

        <input
          id="pokeCustomInput"
          type="text"
          placeholder="自定义动作…"
        >

        <button
          id="pokeCustomSend"
          type="button"
        >
          发送
        </button>

      </div>

    </div>

  </div>

  <!-- =========================
     主动拨打 · 正在呼叫
     ========================= -->

<div
  class="outgoing-call-panel"
  id="outgoingCallPanel"
  hidden
>

  <div class="outgoing-call-content">

    <div
      class="outgoing-call-avatar"
      id="outgoingCallAvatar"
    >
      L
    </div>


    <strong
      class="outgoing-call-name"
      id="outgoingCallName"
    >
      榛榛
    </strong>


    <span
      class="outgoing-call-status"
      id="outgoingCallStatus"
    >
      正在呼叫…
    </span>


    <button
      class="outgoing-call-cancel"
      id="cancelOutgoingCallButton"
      type="button"
    >
      <span>☎</span>
      <small>取消</small>
    </button>

  </div>

</div>

  <!-- =========================
     来电界面
     ========================= -->

<div
  class="incoming-call-panel"
  id="incomingCallPanel"
  hidden
>

  <div class="incoming-call-content">

    <div
      class="incoming-call-avatar"
      id="incomingCallAvatar"
    >
      L
    </div>


    <strong
      class="incoming-call-name"
      id="incomingCallName"
    >
      榛榛
    </strong>


    <span class="incoming-call-status">
      邀请你进行视频通话
    </span>


    <div class="incoming-call-actions">

      <button
        class="incoming-call-button reject"
        id="rejectCallButton"
        type="button"
      >
        <span>×</span>
        <small>拒绝</small>
      </button>


      <button
        class="incoming-call-button answer"
        id="answerCallButton"
        type="button"
      >
        <span>☎</span>
        <small>接听</small>
      </button>

    </div>

  </div>

</div>

<!-- =========================
     已接通 · 全屏视频通话
     ========================= -->

<div
  class="active-call-panel"
  id="activeCallPanel"
  hidden
>

  <!-- 你的摄像头大画面 -->

  <video
    class="active-call-video"
    id="localCallVideo"
    autoplay
    muted
    playsinline
  ></video>


  <!-- 摄像头关闭时的占位 -->

  <div
    class="active-call-camera-off"
    id="activeCallCameraOff"
    hidden
  >
    摄像头已关闭
  </div>


  <!-- 顶部 -->

  <div class="active-call-top">

    <button
      class="active-call-minimize"
      id="minimizeCallButton"
      type="button"
      aria-label="最小化"
    >
      ▢
    </button>


    <span
      class="active-call-duration"
      id="activeCallDuration"
    >
      00:00
    </span>

  </div>


  <!-- 右上角：对方头像小屏 -->

  <div
    class="active-call-remote"
    id="activeCallRemote"
  >

    <div
      class="active-call-remote-avatar"
      id="activeCallRemoteAvatar"
    >
      L
    </div>

    <span
      class="active-call-remote-name"
      id="activeCallRemoteName"
    >
      榛榛
    </span>

  </div>


  <!-- 底部控制 -->

  <div class="active-call-controls">

    <button
      class="call-control-button"
      id="callMicButton"
      type="button"
    >
      <span>🎙</span>
      <small>麦克风已开</small>
    </button>


    <button
      class="call-control-button"
      id="callSpeakerButton"
      type="button"
    >
      <span>🔊</span>
      <small>扬声器已开</small>
    </button>


    <button
      class="call-control-button"
      id="callCameraButton"
      type="button"
    >
      <span>▣</span>
      <small>摄像头已开</small>
    </button>

  </div>


  <div class="active-call-bottom">

    <button
      class="call-switch-camera"
      id="switchCameraButton"
      type="button"
      aria-label="切换摄像头"
    >
      ↻
    </button>


    <button
      class="call-hangup-button"
      id="hangupCallButton"
      type="button"
    >
      ☎
    </button>

  </div>

</div>



<!-- =========================
     已接通 · 网站内最小化
     ========================= -->

<div
  class="call-mini-window"
  id="callMiniWindow"
  hidden
>

  <div class="call-mini-icon">
    ☎
  </div>

  <div
    class="call-mini-duration"
    id="callMiniDuration"
  >
    00:00
  </div>

</div>

  <script src="chat.js"></script>
  <script src="chat-actions.js"></script>
  <script src="chat-selection.js"></script>
  <script src="chat-favorites-save.js"></script>
  <script src="call-global.js"></script>

</body>
</html>
