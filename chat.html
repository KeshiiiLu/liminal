<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 · Liminal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page">

  <header class="chat-header">

    <button class="chat-back" onclick="window.location.href='index.html'">
      ‹
    </button>

    <div class="chat-person">
      <strong id="chatPersonName">榛榛</strong>
      <span id="chatPersonStatus">在线</span>
    </div>

    <button class="chat-settings">
      ···
    </button>

  </header>


 <main class="chat-messages" id="chatMessages">
</main>


 <footer class="chat-bottom">

  <div class="chat-input-bar">

   <button class="chat-tool voice-button" aria-label="语音">
  <svg
    class="voice-icon"
    viewBox="0 0 32 32"
    aria-hidden="true"
  >
    <circle
      cx="16"
      cy="16"
      r="13"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    />

    <path
      d="M12 13.5
         C13.8 15
         13.8 17
         12 18.5"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M16 10.5
         C20 13.5
         20 18.5
         16 21.5"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M9 15
         L7.5 16
         L9 17"
      fill="currentColor"
    />
  </svg>
</button>

    <input
      class="chat-input"
      type="text"
      placeholder="输入消息"
    >

    <button class="chat-tool" aria-label="表情">
      ☺
    </button>

    <button class="chat-tool" id="moreButton" aria-label="更多">
      ＋
    </button>

  </div>


  <div class="more-panel" id="morePanel">

    <div class="more-pages" id="morePages">

      <section class="more-page">

        <button class="more-item">
          <span class="more-icon">▧</span>
          <small>相片</small>
        </button>

        <button class="more-item">
          <span class="more-icon">◉</span>
          <small>拍摄</small>
        </button>

        <button class="more-item">
          <span class="more-icon">↻</span>
          <small>继续说</small>
        </button>

        <button class="more-item">
          <span class="more-icon">▣</span>
          <small>视频通话</small>
        </button>

        <button class="more-item">
          <span class="more-icon">⌖</span>
          <small>位置</small>
        </button>

        <button class="more-item">
          <span class="more-icon">封</span>
          <small>红包</small>
        </button>

        <button class="more-item">
          <span class="more-icon">礼</span>
          <small>礼物</small>
        </button>

        <button class="more-item">
          <span class="more-icon">￥</span>
          <small>转账</small>
        </button>

      </section>


      <section class="more-page">

        <button class="more-item">
          <span class="more-icon">☆</span>
          <small>收藏</small>
        </button>

      </section>

    </div>


    <div class="page-dots">
      <span class="page-dot active"></span>
      <span class="page-dot"></span>
    </div>

  </div>

</footer>

<script src="chat.js"></script>

</body>
</html>
