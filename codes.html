<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f4f3f0"
    >

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Liminal">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>暗号 · Liminal</title>

    <link
        rel="stylesheet"
        href="codes.css"
    >
  <script src="storage-migrations.js"></script>
  <link rel="stylesheet" href="interaction.css">
  <script src="interaction.js" defer></script>
</head>

<body>

    <main class="codes-shell">


        <!-- =========================
             顶部
             ========================= -->

        <header class="codes-header">

            <a
                class="codes-back"
                href="library.html"
                aria-label="返回语料库"
            >
                ‹
            </a>


            <div class="codes-title">

                <span>
                    PRIVATE CODES
                </span>

                <h1>
                    暗号
                </h1>

            </div>


            <div
                class="codes-mode"
                aria-label="只读浏览"
            >
                阅
            </div>

        </header>


        <!-- =========================
             人物切换
             ========================= -->

        <nav
            class="person-tabs"
            id="personTabs"
            aria-label="人物"
        ></nav>


        <!-- =========================
             总览
             ========================= -->

        <section class="codes-summary">

            <div class="summary-copy">

                <span>
                    PERSON CODES
                </span>

                <strong id="summaryName">
                    榛榛
                </strong>

                <p id="summaryMeta">
                    0 已约定 · 0 候选
                </p>

            </div>


            <div class="summary-count">

                <span id="summaryCount">
                    0
                </span>

                <small>
                    CODES
                </small>

            </div>

        </section>


        <!-- =========================
             搜索
             ========================= -->

        <div class="codes-search">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="codesSearch"
                type="search"
                autocomplete="off"
                placeholder="搜索当前人物的暗号"
            >

            <button
                id="searchClear"
                type="button"
                hidden
                aria-label="清除搜索"
            >
                ×
            </button>

        </div>


        <!-- =========================
             列表标题
             ========================= -->

        <div class="list-heading">

            <div>

                <span id="listEyebrow">
                    CATEGORIES
                </span>

                <strong id="listTitle">
                    分类
                </strong>

            </div>


            <small id="listCount">
                0 项
            </small>

        </div>


        <!-- =========================
             分类 / 搜索结果
             ========================= -->

        <section
            class="codes-list"
            id="codesList"
        ></section>


        <section
            class="codes-empty"
            id="codesEmpty"
            hidden
        >

            <span>
                NO RESULT
            </span>

            <p id="emptyText">
                暂无内容
            </p>

        </section>


        <!-- =========================
             说明
             ========================= -->

        <section class="codes-note">

            <span>
                RANDOM RULE
            </span>

            <p>
                暗号作为独立 01 参与随机；内部分类只用于整理，不参与概率。
            </p>

        </section>

    </main>


    <!-- =========================
         分类详情
         ========================= -->

    <div
        class="code-backdrop"
        id="codeBackdrop"
        hidden
    ></div>


    <section
        class="code-sheet"
        id="codeSheet"
        aria-hidden="true"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <div>

                <span id="sheetPath">
                    榛榛 / 01
                </span>

                <h2 id="sheetTitle">
                    安抚信号
                </h2>

            </div>


            <button
                class="sheet-close"
                id="sheetClose"
                type="button"
                aria-label="关闭"
            >
                ×
            </button>

        </div>


        <div class="sheet-meta">

            <span
                class="status-badge"
                id="sheetStatus"
            >
                已约定
            </span>

            <i></i>

            <span id="sheetCount">
                0 条
            </span>

            <i></i>

            <span>
                READ ONLY
            </span>

        </div>


        <div
            class="sheet-codes"
            id="sheetCodes"
        ></div>


        <div class="sheet-readonly">

            <span>
                STATIC DATA
            </span>

            <p>
                暗号及其含义由电脑端数据文件维护
            </p>

        </div>

    </section>


    <script src="opencc-full.js"></script>
    <script src="codes-data.js"></script>
    <script src="codes.js"></script>

</body>

</html>
