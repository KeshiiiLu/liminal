<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f3f0">

  <title>Liminal</title>

  <link rel="stylesheet" href="home.css">
</head>

<body>

  <main class="home-shell">

    <header class="home-header">
      <div>
        <p class="home-eyebrow">LMN</p>
        <h1>Liminal</h1>
      </div>

      <div class="home-avatar">L</div>
    </header>


    <div class="desktop-pages">

      <!-- =========================
           第一页：交流
           ========================= -->
      <section class="desktop-page">

        <div class="calendar-widget">

          <div class="calendar-title">
            <strong>2026年8月</strong>
          </div>

          <div class="calendar-week">
            <span>日</span>
            <span>一</span>
            <span>二</span>
            <span>三</span>
            <span>四</span>
            <span>五</span>
            <span>六</span>
          </div>

          <div class="calendar-grid">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

            <span>1</span>

            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>

            <span>9</span>
            <span>10</span>
            <span>11</span>
            <span>12</span>
            <span>13</span>
            <span>14</span>
            <span>15</span>

            <span>16</span>

            <span class="calendar-day today">
              <b>17</b>
              <small>● ●</small>
            </span>

            <span>18</span>
            <span>19</span>
            <span>20</span>
            <span>21</span>
            <span>22</span>

            <span>23</span>
            <span>24</span>
            <span>25</span>
            <span>26</span>
            <span>27</span>
            <span>28</span>
            <span>29</span>

            <span>30</span>
            <span>31</span>

          </div>

        </div>


  <div class="app-grid">

  <a class="app-item app-link" href="messages.html">
    <div class="app-icon chat-icon">聊</div>
    <span>聊天</span>
  </a>

  <div class="app-item">
    <div class="app-icon moments-icon">◌</div>
    <span>朋友圈</span>
  </div>

  <div class="app-item">
    <div class="app-icon signal-icon">···</div>
    <span>传讯</span>
  </div>

  <div class="app-item">
    <div class="app-icon tarot-icon">✦</div>
    <span>塔罗</span>
  </div>

</div>

      </section>


      <!-- =========================
           第二页：记录与生活
           ========================= -->
      <section class="desktop-page">

        <div class="page-heading">
          <small>RECORDS & LIFE</small>
          <h2>生活与记录</h2>
        </div>

        <div class="app-grid large-gap">

          <div class="app-item">
            <div class="app-icon diary-icon">记</div>
            <span>日记</span>
          </div>

          <div class="app-item">
            <div class="app-icon mail-icon">✉</div>
            <span>信箱</span>
          </div>

          <div class="app-item">
            <div class="app-icon timeline-icon">⌁</div>
            <span>时间轴</span>
          </div>

          <div class="app-item">
            <div class="app-icon music-icon">♫</div>
            <span>一起听歌</span>
          </div>

          <a class="app-item app-link" href="wallet.html">
            <div class="app-icon wallet-icon">¥</div>
            <span>钱包</span>
          </a>

          <div class="app-item">
            <div class="app-icon shop-icon">袋</div>
            <span>次元购物城</span>
          </div>

        </div>

      </section>


      <!-- =========================
           第三页：数据与系统
           ========================= -->
      <section class="desktop-page">

        <div class="page-heading">
          <small>DATA & SYSTEM</small>
          <h2>数据与系统</h2>
        </div>

        <div class="app-grid large-gap">

          <div class="app-item">
            <div class="app-icon library-icon">库</div>
            <span>语料 · 图库</span>
          </div>

          <div class="app-item">
            <div class="app-icon search-icon">⌕</div>
            <span>全局搜索</span>
          </div>

          <div class="app-item">
            <div class="app-icon backup-icon">⇧</div>
            <span>导出 · 备份</span>
          </div>

          <div class="app-item">
            <div class="app-icon settings-icon">⚙</div>
            <span>设置</span>
          </div>

        </div>

      </section>

    </div>


    <div class="desktop-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </main>

  <script src="home.js"></script>
</body>
</html>
