<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f3">

  <title>Liminal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">LMN</p>
        <h1>Liminal</h1>
      </div>

      <button class="avatar-button" aria-label="人物">
        L
      </button>
    </header>


    <section class="welcome">
      <p class="welcome-label">当前连接</p>

      <div class="person-card">
        <div class="person-avatar">
          L
        </div>

        <div class="person-info">
          <strong>陆榛</strong>
          <span>在线 · Liminal</span>
        </div>

        <span class="status-dot"></span>
      </div>
    </section>


    <section class="quick-grid">

      <button class="quick-card">
        <span class="quick-icon">💬</span>
        <strong>聊天</strong>
        <small>日常交流</small>
      </button>

      <button class="quick-card" id="transmissionButton">
        <span class="quick-icon">◌</span>
        <strong>传讯</strong>
        <small>随机字卡</small>
      </button>

      <button class="quick-card">
        <span class="quick-icon">✦</span>
        <strong>塔罗</strong>
        <small>抽牌与记录</small>
      </button>

      <button class="quick-card">
        <span class="quick-icon">⌁</span>
        <strong>时间轴</strong>
        <small>关系档案</small>
      </button>

    </section>


    <section class="section-block">

      <div class="section-title">
        <h2>最近</h2>
        <button>查看全部</button>
      </div>

      <div class="empty-card">
        <span>这里以后会显示最近的聊天、传讯、信件和动态。</span>
      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button class="nav-item active">
      <span>⌂</span>
      <small>首页</small>
    </button>

    <button class="nav-item">
      <span>◌</span>
      <small>传讯</small>
    </button>

    <button class="nav-item">
      <span>✦</span>
      <small>动态</small>
    </button>

    <button class="nav-item">
      <span>☰</span>
      <small>更多</small>
    </button>

  </nav>
<script src="script.js"></script>
</body>
</html>
