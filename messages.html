<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eeeeec">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Liminal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>聊天 · Liminal</title>

  <link rel="stylesheet" href="messages.css">
  <link rel="stylesheet" href="avatar-store.css">
  <script src="storage-migrations.js"></script>
  <link rel="stylesheet" href="interaction.css">
  <script src="interaction.js" defer></script>
</head>

<body>

  <main class="messages-page">

    <!-- 顶部封面 -->
    <section class="profile-cover" id="profileCover">

      <img class="profile-cover-image" id="profileCoverImage" alt="" hidden>

      <button class="profile-cover-action" id="profileCoverAction" type="button" aria-label="更换个人主页背景"></button>

      <button class="back-button" onclick="window.location.href='index.html'" aria-label="返回">
        ‹
      </button>

    </section>


    <!-- 个人资料 -->
    <section class="profile-card">

      <button class="profile-avatar" id="profileAvatarButton" type="button" data-avatar-person="keshi" data-avatar-fallback="K" aria-label="更换 Keshi 头像">
        K
      </button>

      <h1>Keshi</h1>

      <p class="profile-id">
        @Keshiii_Lu
      </p>

      <button class="profile-bio is-empty" id="profileBioButton" type="button">
        这里点击替换文案
      </button>

    </section>


    <!-- 联系人 -->
    <section class="contacts-section">

      <h2>联系人</h2>

      <div class="contact-search">
        <span>⌕</span>
        <input type="text" placeholder="搜索联系人" readonly>
      </div>


      <p class="contact-group-title">
        星标联系人
      </p>


      <!-- 陆榛 -->
      <a class="contact-item starred" href="chat.html?person=luzhen">

        <div class="contact-avatar" data-avatar-person="luzhen" data-avatar-fallback="L">
          L
        </div>

        <div class="contact-info">
          <strong>榛榛</strong>
          <span>在线</span>
        </div>

        <span class="contact-star">
          ★
        </span>

      </a>


      <p class="contact-group-title normal-group">
        联系人
      </p>


      <!-- Jasper -->
      <a
  class="contact-item"
  href="chat.html?person=jasper"
>

  <div class="contact-avatar" data-avatar-person="jasper" data-avatar-fallback="J">
    J
  </div>

  <div class="contact-info">
    <strong>Jasper</strong>
    <span>在线</span>
  </div>

</a>

    </section>


    <!-- 底部悬浮栏 -->
    <nav class="messages-bottom-bar">

      <button aria-label="搜索">
        <span>⌕</span>
      </button>

      <button aria-label="新增联系人">
        <span>＋</span>
      </button>

    </nav>

  </main>

  <div class="profile-editor" id="bioEditor" aria-hidden="true" inert hidden>
    <button class="profile-editor-backdrop" type="button" data-profile-editor-close aria-label="取消编辑个人简介"></button>
    <section class="profile-editor-sheet" role="dialog" aria-modal="true" aria-labelledby="bioEditorTitle">
      <div class="profile-editor-handle" aria-hidden="true"></div>
      <header class="profile-editor-header">
        <div>
          <span>PROFILE BIO</span>
          <h2 id="bioEditorTitle">个人简介</h2>
        </div>
        <button class="profile-editor-close" type="button" data-profile-editor-close aria-label="取消">×</button>
      </header>

      <form id="bioEditorForm">
        <label for="profileBioInput">写一点关于现在的自己</label>
        <textarea id="profileBioInput" maxlength="160" rows="4" placeholder="可以留空"></textarea>
        <div class="profile-editor-actions">
          <button class="profile-editor-secondary" type="button" data-profile-editor-close>取消</button>
          <button class="profile-editor-primary" type="submit">保存</button>
        </div>
      </form>
    </section>
  </div>

  <div class="profile-editor" id="coverEditor" aria-hidden="true" inert hidden>
    <button class="profile-editor-backdrop" type="button" data-profile-editor-close aria-label="取消更换背景"></button>
    <section class="profile-editor-sheet" role="dialog" aria-modal="true" aria-labelledby="coverEditorTitle">
      <div class="profile-editor-handle" aria-hidden="true"></div>
      <header class="profile-editor-header">
        <div>
          <span>PROFILE COVER</span>
          <h2 id="coverEditorTitle">更换背景</h2>
        </div>
        <button class="profile-editor-close" type="button" data-profile-editor-close aria-label="取消">×</button>
      </header>

      <div class="profile-cover-preview" id="profileCoverPreview" aria-label="背景预览"></div>
      <p class="profile-cover-help">图片会居中裁切并压缩，只保存在这台设备。</p>

      <label class="profile-file-button" for="profileCoverFile">
        从相册选择
        <input id="profileCoverFile" type="file" accept="image/*">
      </label>

      <p class="profile-editor-status" id="profileCoverStatus" aria-live="polite"></p>

      <div class="profile-editor-actions">
        <button class="profile-editor-secondary" id="profileCoverCancel" type="button">取消</button>
        <button class="profile-editor-primary" id="profileCoverSave" type="button" data-liminal-allow-repeat disabled>保存</button>
      </div>

      <button class="profile-cover-reset" id="profileCoverReset" type="button">恢复默认背景</button>
    </section>
  </div>

  <script src="avatar-store.js"></script>
  <script src="messages.js"></script>
  <script src="call-global.js"></script>

</body>

</html>
