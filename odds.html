<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Liminal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f3f0">

  <title>Today's Odds · Liminal</title>

  <link
    rel="stylesheet"
    href="world.css"
  >
  <script src="storage-migrations.js"></script>
</head>


<body>

  <main class="world-shell">

    <header class="world-header">

      <button
        class="back-button"
        onclick="window.location.href='index.html?page=3'"
      >
        ‹
      </button>

      <div>
        <span>TODAY'S ODDS</span>
        <h1>今日概率</h1>
      </div>

    </header>


    <section class="today-card">

      <div>

        <span id="todayDate">
          TODAY
        </span>

        <h2>陆榛</h2>

      </div>

      <div class="today-badge">
        DAILY
      </div>

    </section>


    <section
      class="odds-list"
      id="oddsList"
    >
    </section>


    <section class="info-card">

      <span>HOW IT WORKS</span>

      <p>
        今天的数值从设置中的上下限范围随机生成。
        同一天刷新页面不会重新抽取。
      </p>

      <p>
        修改长期设置后，今天会重新生成一次，
        方便目前测试规则。
      </p>

    </section>


    <a
      class="secondary-link"
      href="settings.html"
    >
      修改概率范围 →
    </a>

  </main>


  <script src="odds.js"></script>

</body>
</html>
