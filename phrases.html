<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f4f3f0"
    >

    <title>快捷用语 · Liminal</title>

    <link
        rel="stylesheet"
        href="phrases.css"
    >
</head>

<body>

    <main class="phrases-shell">


        <!-- =========================
             顶部
             ========================= -->

        <header class="phrases-header">

            <a
                class="phrases-back"
                href="library.html"
                aria-label="返回语料库"
            >
                ‹
            </a>


            <div class="phrases-title">

                <span>
                    QUICK PHRASES
                </span>

                <h1>
                    快捷用语
                </h1>

            </div>


            <div
                class="phrases-mode"
                aria-label="只读浏览"
            >
                阅
            </div>

        </header>


        <!-- =========================
             人物切换
             ========================= -->

        <nav
            class="person-tabs"
            id="personTabs"
            aria-label="人物"
        ></nav>


        <!-- =========================
             总览
             ========================= -->

        <section class="phrases-summary">

            <div class="summary-copy">

                <span>
                    PERSON CORPUS
                </span>

                <strong id="summaryName">
                    榛榛
                </strong>

                <p id="summaryMeta">
                    0 个分类 · 0 条用语
                </p>

            </div>


            <div class="summary-count">

                <span id="summaryCount">
                    0
                </span>

                <small>
                    PHRASES
                </small>

            </div>

        </section>


        <!-- =========================
             搜索
             ========================= -->

        <div class="phrases-search">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="phrasesSearch"
                type="search"
                autocomplete="off"
                placeholder="搜索当前人物的快捷用语"
            >

            <button
                id="searchClear"
                type="button"
                hidden
                aria-label="清除搜索"
            >
                ×
            </button>

        </div>


        <!-- =========================
             列表标题
             ========================= -->

        <div class="list-heading">

            <div>

                <span id="listEyebrow">
                    CATEGORIES
                </span>

                <strong id="listTitle">
                    分类
                </strong>

            </div>


            <small id="listCount">
                0 项
            </small>

        </div>


        <!-- =========================
             分类 / 搜索结果
             ========================= -->

        <section
            class="phrases-list"
            id="phrasesList"
        ></section>


        <section
            class="phrases-empty"
            id="phrasesEmpty"
            hidden
        >

            <span>
                NO RESULT
            </span>

            <p id="emptyText">
                暂无内容
            </p>

        </section>


        <!-- =========================
             说明
             ========================= -->

        <section class="phrases-note">

            <span>
                RANDOM RULE
            </span>

            <p>
                分类只用于整理与查找，不参与快捷用语内部随机概率。
            </p>

        </section>

    </main>


    <!-- =========================
         分类详情
         ========================= -->

    <div
        class="phrase-backdrop"
        id="phraseBackdrop"
        hidden
    ></div>


    <section
        class="phrase-sheet"
        id="phraseSheet"
        aria-hidden="true"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <div>

                <span id="sheetPath">
                    榛榛 / 01
                </span>

                <h2 id="sheetTitle">
                    基础回应
                </h2>

            </div>


            <button
                class="sheet-close"
                id="sheetClose"
                type="button"
                aria-label="关闭"
            >
                ×
            </button>

        </div>


        <div class="sheet-meta">

            <span id="sheetCount">
                0 条
            </span>

            <i></i>

            <span>
                READ ONLY
            </span>

        </div>


        <div
            class="sheet-phrases"
            id="sheetPhrases"
        ></div>


        <div class="sheet-readonly">

            <span>
                STATIC DATA
            </span>

            <p>
                具体语料由电脑端数据文件维护
            </p>

        </div>

    </section>


    <script src="opencc-full.js"></script>
<script src="phrases-data.js"></script>
<script src="phrases.js"></script>

</body>

</html>
