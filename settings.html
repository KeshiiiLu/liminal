<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/liminal-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Liminal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f3f0">

  <title>Settings · Liminal</title>

  <link
    rel="stylesheet"
    href="world.css"
  >
  <script src="storage-migrations.js"></script>
</head>


<body>

  <main class="world-shell">

    <header class="world-header">

      <button
        class="back-button"
        onclick="window.location.href='index.html?page=3'"
      >
        ‹
      </button>

      <div>
        <span>LIMINAL SETTINGS</span>
        <h1>设置</h1>
      </div>

    </header>


    <section class="settings-menu">


      <button class="settings-menu-item">

        <div>
          <span>APPEARANCE</span>
          <strong>外观与主题</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>HOME</span>
          <strong>Home 与小组件</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>NOTIFICATIONS</span>
          <strong>通知与来电</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>PEOPLE</span>
          <strong>人物管理</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>WORLD</span>
          <strong>世界运行</strong>
        </div>

        <em>›</em>

      </button>


      <a
        class="settings-menu-item"
        href="changelog.html"
        aria-label="打开版本与更新"
      >

        <div>
          <span>ABOUT</span>
          <strong>版本与更新</strong>
        </div>

        <em
          class="settings-version-label"
          id="settingsVersionLabel"
          aria-label="当前版本"
        ></em>

      </a>

    </section>


    <p class="settings-note">
      设置项目会随着 Liminal 的开发逐步接入。
    </p>

    <p
      class="settings-note settings-version-footer"
      id="settingsVersionFooter"
      aria-live="polite"
    ></p>

  </main>

  <script src="version-data.js"></script>
  <script src="version-ui.js"></script>

</body>

</html>
