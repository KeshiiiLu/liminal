<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Settings · Liminal</title>

  <link
    rel="stylesheet"
    href="world.css"
  >
  <script src="storage-migrations.js"></script>
</head>


<body>

  <main class="world-shell">

    <header class="world-header">

      <button
        class="back-button"
        onclick="window.location.href='index.html?page=3'"
      >
        ‹
      </button>

      <div>
        <span>LIMINAL SETTINGS</span>
        <h1>设置</h1>
      </div>

    </header>


    <section class="settings-menu">


      <button class="settings-menu-item">

        <div>
          <span>APPEARANCE</span>
          <strong>外观与主题</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>HOME</span>
          <strong>Home 与小组件</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>NOTIFICATIONS</span>
          <strong>通知与来电</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>PEOPLE</span>
          <strong>人物管理</strong>
        </div>

        <em>›</em>

      </button>


      <button class="settings-menu-item">

        <div>
          <span>WORLD</span>
          <strong>世界运行</strong>
        </div>

        <em>›</em>

      </button>


      <a
        class="settings-menu-item"
        href="data-management.html"
      >

        <div>
          <span>DATA</span>
          <strong>数据与存储</strong>
        </div>

        <em>›</em>

      </a>


    </section>


    <p class="settings-note">
      数据与存储已接入，
      其余项目会随着 Liminal 的开发逐步接入。
    </p>

  </main>

</body>

</html>
